<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Huninn&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/qweather-icons@1.3.2/font/qweather-icons.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <title>Weather App</title>
  </head>

  <body>
    <script src="main.js"></script>

    <div class="container">
      <div.search-box>
        <i class="qi-101"></i>
        <input type="text" placeholder="Enter location name" />
        <button class="search-btn">Search</button>
      </div.search-box>

      <div class="not-found">
        <p>Location not found</p>
      </div>

      <div class="weather-box">
        <img src="node_modules/qweather-icons\icons\2155.svg" />
        <p class="temperature"></p>
        <p class="description"></p>
      </div>

      <div class="weather-details">
        <div class="humidity">
          <img src="node_modules/qweather-icons\icons\2120.svg" />
          <div class="text">
            <span></span>
            <p>Humidity</p>
          </div>
        </div>
      </div>

      <div class="wind">
        <div class="humidity">
          <img src="node_modules/qweather-icons\icons\2208.svg" />
          <div class="text">
            <span></span>
            <p>Wind Speed</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
